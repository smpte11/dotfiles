[tools]
shellcheck = "latest"

[tasks.lint]
description = "Check the shell scripts with shellcheck"
run = "test/lint.sh"

[tasks."test:fresh"]
depends = ["lint"]
description = "Install the dotfiles in Linux containers and check them (usage: mise run test:fresh [modules...] [--only group,...] [--fresh])"
run = "test/run.sh fresh"

[tasks."test:shell"]
description = "Open a shell in the test container"
run = "test/run.sh shell"

[tasks."test:clean"]
description = "Remove the test images, checkpoints and tool cache volumes"
run = "test/run.sh clean"

[tasks."deck:import"]
description = "Convert the Elgato Stream Deck profiles of this Mac into the OpenDeck profiles of the desktop module"
run = "node scripts/elgato-to-opendeck.mjs"
