[tasks."test:fresh"]
description = "Install the dotfiles in a Linux container and check them (modules: none, personal, work)"
run = "test/run.sh fresh"

[tasks."test:migrate"]
description = "Migrate a Linux container from a chezmoi revision and check it (usage: mise run test:migrate <ref>)"
run = "test/run.sh migrate"

[tasks."test:shell"]
description = "Open a shell in the test container"
run = "test/run.sh shell"

[tasks."test:clean"]
description = "Remove the test image and tool cache volume"
run = "test/run.sh clean"
