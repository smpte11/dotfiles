[tools]
"aqua:nushell/nushell" = "latest"
helix = "latest"
"github:kunchenguid/no-mistakes" = "latest"

[bootstrap.packages]
"flatpak-user:me.amankhanna.opendeck" = { os = "linux" }
"macos-app:OpenDeck" = { version = "2.14.2", os = "macos/arm64", url = "https://github.com/nekename/OpenDeck/releases/download/v2.14.2/OpenDeck_aarch64.app.tar.gz", sha256 = "e1df9ade9e7a28183697dc58345cd9bf67e85ad9a8b2a94a59ff2e3524a2939b", artifact = "OpenDeck.app" }
"macos-app:OpenDeck-x64" = { version = "2.14.2", os = "macos/x64", url = "https://github.com/nekename/OpenDeck/releases/download/v2.14.2/OpenDeck_x64.app.tar.gz", sha256 = "61c6948bf8b61630d6d4055d0a9cea833a4f5ce65bb646c6d41eb5cb01e494b2", artifact = "OpenDeck.app" }

[dotfile_groups.desktop]
root = "desktop"
exclude = [".local/share/opendeck"]

[dotfile_groups.desktop.entries]
"~/Library/Application Support/opendeck/plugins/com.felbro.journal.sdPlugin" = { mode = "copy", source = ".local/share/opendeck/plugins/com.felbro.journal.sdPlugin", variants = [{ os = "macos" }] }
"~/Library/Application Support/opendeck/plugins/com.felbro.journal.sdPlugin/plugin.js" = { mode = "template", source = ".local/share/opendeck/plugins/com.felbro.journal.sdPlugin/plugin.js.tera", variants = [{ os = "macos" }] }
"~/.config/opendeck/plugins/com.felbro.journal.sdPlugin" = { mode = "copy", source = ".local/share/opendeck/plugins/com.felbro.journal.sdPlugin", variants = [{ os = "linux" }] }
"~/.config/opendeck/plugins/com.felbro.journal.sdPlugin/plugin.js" = { mode = "template", source = ".local/share/opendeck/plugins/com.felbro.journal.sdPlugin/plugin.js.tera", variants = [{ os = "linux" }] }
"~/.var/app/me.amankhanna.opendeck/config/opendeck/plugins/com.felbro.journal.sdPlugin" = { mode = "copy", source = ".local/share/opendeck/plugins/com.felbro.journal.sdPlugin", variants = [{ os = "linux" }] }
"~/.var/app/me.amankhanna.opendeck/config/opendeck/plugins/com.felbro.journal.sdPlugin/plugin.js" = { mode = "template", source = ".local/share/opendeck/plugins/com.felbro.journal.sdPlugin/plugin.js.tera", variants = [{ os = "linux" }] }
"~/Library/Application Support/opendeck/plugins/com.felbro.pixel.sdPlugin" = { mode = "copy", source = ".local/share/opendeck/plugins/com.felbro.pixel.sdPlugin", variants = [{ os = "macos" }] }
"~/Library/Application Support/opendeck/plugins/com.felbro.pixel.sdPlugin/colors.json" = { mode = "template", source = ".local/share/opendeck/plugins/com.felbro.pixel.sdPlugin/colors.json.tera", variants = [{ os = "macos" }] }
"~/.config/opendeck/plugins/com.felbro.pixel.sdPlugin" = { mode = "copy", source = ".local/share/opendeck/plugins/com.felbro.pixel.sdPlugin", variants = [{ os = "linux" }] }
"~/.config/opendeck/plugins/com.felbro.pixel.sdPlugin/colors.json" = { mode = "template", source = ".local/share/opendeck/plugins/com.felbro.pixel.sdPlugin/colors.json.tera", variants = [{ os = "linux" }] }
"~/.var/app/me.amankhanna.opendeck/config/opendeck/plugins/com.felbro.pixel.sdPlugin" = { mode = "copy", source = ".local/share/opendeck/plugins/com.felbro.pixel.sdPlugin", variants = [{ os = "linux" }] }
"~/.var/app/me.amankhanna.opendeck/config/opendeck/plugins/com.felbro.pixel.sdPlugin/colors.json" = { mode = "template", source = ".local/share/opendeck/plugins/com.felbro.pixel.sdPlugin/colors.json.tera", variants = [{ os = "linux" }] }
"~/Library/Application Support/opendeck/images" = { mode = "copy", source = ".local/share/opendeck/images", variants = [{ os = "macos" }] }
"~/Library/Application Support/opendeck/profiles" = { mode = "symlink-each", source = ".local/share/opendeck/profiles/macos", variants = [{ os = "macos" }] }
"~/.config/opendeck/images" = { mode = "copy", source = ".local/share/opendeck/images", variants = [{ os = "linux" }] }
"~/.config/opendeck/profiles" = { mode = "symlink-each", source = ".local/share/opendeck/profiles/linux", variants = [{ os = "linux" }] }
"~/.var/app/me.amankhanna.opendeck/config/opendeck/images" = { mode = "copy", source = ".local/share/opendeck/images", variants = [{ os = "linux" }] }
"~/.var/app/me.amankhanna.opendeck/config/opendeck/profiles" = { mode = "symlink-each", source = ".local/share/opendeck/profiles/linux", variants = [{ os = "linux" }] }

[bootstrap.macos.launchd.agents.journal]
program = "~/.local/bin/journal-reminder"
start_calendar_interval = [
  { weekday = 1, hour = 8, minute = 30 },
  { weekday = 2, hour = 8, minute = 30 },
  { weekday = 3, hour = 8, minute = 30 },
  { weekday = 4, hour = 8, minute = 30 },
  { weekday = 5, hour = 8, minute = 30 },
]
stdout_path = "~/Library/Logs/journal.log"
stderr_path = "~/Library/Logs/journal.log"

[bootstrap.macos.launchd.agents.journal-checkin]
program = "~/.local/bin/journal-checkin"
start_calendar_interval = [
  { weekday = 1, hour = 11, minute = 0 },
  { weekday = 1, hour = 14, minute = 0 },
  { weekday = 1, hour = 16, minute = 30 },
  { weekday = 2, hour = 11, minute = 0 },
  { weekday = 2, hour = 14, minute = 0 },
  { weekday = 2, hour = 16, minute = 30 },
  { weekday = 3, hour = 11, minute = 0 },
  { weekday = 3, hour = 14, minute = 0 },
  { weekday = 3, hour = 16, minute = 30 },
  { weekday = 4, hour = 11, minute = 0 },
  { weekday = 4, hour = 14, minute = 0 },
  { weekday = 4, hour = 16, minute = 30 },
  { weekday = 5, hour = 11, minute = 0 },
  { weekday = 5, hour = 14, minute = 0 },
  { weekday = 5, hour = 16, minute = 30 },
]
stdout_path = "~/Library/Logs/journal.log"
stderr_path = "~/Library/Logs/journal.log"

[bootstrap.linux.systemd.units.journal-reminder]
description = "Evening journal reminder"
type = "oneshot"
exec_start = "~/.local/bin/journal-reminder"
start = false
wanted_by = []

[bootstrap.linux.systemd.units.journal-reminder-timer]
description = "Evening journal reminder at 20:30"
on_calendar = "*-*-* 20:30"
unit = "journal-reminder"

[bootstrap.hooks]
pre-packages = [
  "if command -v flatpak >/dev/null; then flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo; fi",
]
post-dotfiles = [
  "if command -v flatpak >/dev/null; then flatpak override --user --filesystem={{ env.HOME }}/.dotfiles/desktop/.local/share/opendeck me.amankhanna.opendeck; fi",
]
