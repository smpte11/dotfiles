[env]
SSH_AUTH_SOCK = "{{ env.HOME }}/.ssh/proton-pass-agent.sock"
PROTON_PASS_LINUX_KEYRING = "dbus"
NVIM_AI_PROVIDER = "codestral"
_.file = { path = "{{ env.HOME }}/.config/codestral/env", redact = true }

[tools]
"github:floatpane/matcha" = "latest"

[dotfile_groups.personal]
root = "personal"

[dotfile_groups.personal.entries]
"~/.config/codestral/env" = { mode = "template", create_if_missing = true, permissions = "0600" }

[bootstrap.secrets.codestral_api_key]
env = "CODESTRAL_API_KEY"
description = "Codestral API key"
allow_empty = true

[bootstrap.services.proton-pass-ssh-agent]
scope = "user"
description = "Proton Pass SSH agent"
command = "~/.local/bin/proton-pass-ssh-agent"
restart = "always"
environment = { PROTON_PASS_LINUX_KEYRING = "dbus" }
