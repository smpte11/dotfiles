[dotfile_groups.gaming]
root = "gaming"
exclude = ["quadlets", "questarr", "systemd"]

[dotfile_groups.gaming.entries]
"~/.config/containers/systemd/netfelix/questarr.container" = { mode = "template", source = "quadlets/questarr.container.tera" }
"~/.config/containers/systemd/netfelix/questarr-config.container" = { mode = "template", source = "quadlets/questarr-config.container.tera" }
"~/.config/systemd/user/questarr-config.timer" = { mode = "copy", source = "systemd/questarr-config.timer" }
"~/.config/media/questarr/apply.py" = { mode = "copy", source = "questarr/apply.py", permissions = "0755" }
"~/.config/media/questarr/config.json" = { mode = "copy", source = "questarr/config.json", permissions = "0600" }

[bootstrap.secrets.questarr_api_key]
env = "QUESTARR_API_KEY"
description = "Questarr admin-scope API key (pass://Media/Netfelix/QUESTARR_API_KEY)"
allow_empty = true

[bootstrap.secrets.prowlarr_api_key]
env = "PROWLARR_API_KEY"
description = "Prowlarr API key (pass://Media/Netfelix/PROWLARR_API_KEY)"
allow_empty = true

[bootstrap.secrets.qbit_username]
env = "QBIT_USERNAME"
description = "qBittorrent username (pass://Media/Netfelix/QBIT_USERNAME)"
allow_empty = true

[bootstrap.secrets.qbit_password]
env = "QBIT_PASSWORD"
description = "qBittorrent password (pass://Media/Netfelix/QBIT_PASSWORD)"
allow_empty = true

[bootstrap.directories."~/.config/questarr"]

[bootstrap.directories."~/.local/share/questarr"]
