[vars]
vpn_interface = "proton0"
questarr_games = "/run/media/system/media/media/games"

[dotfile_groups.media]
root = "media"
exclude = ["quadlets", "configarr", "seed", "systemd", "scripts"]

[dotfile_groups.media.entries]
"~/.config/containers/systemd/netfelix/netfelix.pod" = { mode = "copy", source = "quadlets/netfelix/netfelix.pod" }
"~/.config/containers/systemd/netfelix/sonarr.container" = { mode = "template", source = "quadlets/netfelix/sonarr.container.tera" }
"~/.config/containers/systemd/netfelix/radarr.container" = { mode = "template", source = "quadlets/netfelix/radarr.container.tera" }
"~/.config/containers/systemd/netfelix/radarr-kids.container" = { mode = "template", source = "quadlets/netfelix/radarr-kids.container.tera" }
"~/.config/containers/systemd/netfelix/seerr-kids.container" = { mode = "template", source = "quadlets/netfelix/seerr-kids.container.tera" }
"~/.config/containers/systemd/netfelix/prowlarr.container" = { mode = "template", source = "quadlets/netfelix/prowlarr.container.tera" }
"~/.config/containers/systemd/netfelix/jellyfin.container" = { mode = "template", source = "quadlets/netfelix/jellyfin.container.tera" }
"~/.config/containers/systemd/netfelix/seerr.container" = { mode = "template", source = "quadlets/netfelix/seerr.container.tera" }
"~/.config/containers/systemd/netfelix/byparr.container" = { mode = "template", source = "quadlets/netfelix/byparr.container.tera" }
"~/.config/containers/systemd/netfelix/configarr.container" = { mode = "template", source = "quadlets/netfelix/configarr.container.tera" }
"~/.config/containers/systemd/netfelix/qbittorrent.container" = { mode = "template", source = "quadlets/netfelix/qbittorrent.container.tera" }
"~/.config/systemd/user/configarr.timer" = { mode = "copy", source = "systemd/configarr.timer" }
"~/.config/systemd/user/qbit-vpn-guard.service" = { mode = "template", source = "systemd/qbit-vpn-guard.service.tera" }
"~/.config/media/qbit-vpn-guard.sh" = { mode = "template", source = "scripts/qbit-vpn-guard.sh.tera", permissions = "0700" }
"~/.config/media/configarr/config.yml" = { mode = "copy", source = "configarr/config.yml", permissions = "0600" }
"~/.config/sonarr/config.xml" = { mode = "template", source = "seed/sonarr.config.xml.tera", create_if_missing = true, permissions = "0600" }
"~/.config/radarr/config.xml" = { mode = "template", source = "seed/radarr.config.xml.tera", create_if_missing = true, permissions = "0600" }
"~/.config/radarr-kids/config.xml" = { mode = "template", source = "seed/radarr-kids.config.xml.tera", create_if_missing = true, permissions = "0600" }
"~/.config/prowlarr/config.xml" = { mode = "template", source = "seed/prowlarr.config.xml.tera", create_if_missing = true, permissions = "0600" }

[bootstrap.directories."~/.config/radarr-kids"]
mode = "0700"

[bootstrap.directories."~/.config/seerr-kids"]
mode = "0700"

[bootstrap.secrets.sonarr_api_key]
env = "SONARR_API_KEY"
description = "Sonarr API key (pass://Media/Netfelix/SONARR_API_KEY)"
allow_empty = true

[bootstrap.secrets.radarr_api_key]
env = "RADARR_API_KEY"
description = "Radarr API key (pass://Media/Netfelix/RADARR_API_KEY)"
allow_empty = true

[bootstrap.secrets.radarr_kids_api_key]
env = "RADARR_KIDS_API_KEY"
description = "Radarr Kids API key (pass://Media/radarr-kids apiKey)"
allow_empty = true

[bootstrap.secrets.prowlarr_api_key]
env = "PROWLARR_API_KEY"
description = "Prowlarr API key (pass://Media/Netfelix/PROWLARR_API_KEY)"
allow_empty = true

[bootstrap.secrets.qbit_username]
env = "QBIT_USERNAME"
description = "qBittorrent username (pass://Media/Netfelix/QBIT_USERNAME)"
allow_empty = true

[bootstrap.secrets.qbit_password]
env = "QBIT_PASSWORD"
description = "qBittorrent password (pass://Media/Netfelix/QBIT_PASSWORD)"
allow_empty = true

[bootstrap.secrets.yts_api_url]
env = "YTS_API_URL"
description = "YTS indexer apiurl including its key (pass://Media/Netfelix/YTS_API_URL)"
allow_empty = true

