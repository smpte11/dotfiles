[settings]
experimental = true

[vars]
profile = "personal"
email = "felix@brouss.eu"
theme = { default = "eldritch" }

[env]
FM_HARNESS = "pi"

[tools]
usage = "latest"
carapace = "latest"
delta = "latest"
devcontainer-cli = "latest"
eza = "latest"
fd = "latest"
fzf = "latest"
gh = "latest"
glow = "latest"
go = "latest"
gofumpt = "latest"
gum = "latest"
helix = "latest"
lazydocker = "latest"
lua-language-server = "latest"
jj = "latest"
jq = "latest"
jjui = "latest"
neovim = "latest"
node = "24.13.0"
oh-my-posh = "latest"
ollama = "latest"
pi = "latest"
ripgrep = "latest"
television = "latest"
tree-sitter = "latest"
yq = "latest"
zoxide = "latest"
"aqua:nushell/nushell" = "latest"
"aqua:zk-org/zk" = "latest"
"aqua:tealdeer-rs/tealdeer" = "latest"
"aqua:walles/moor" = "latest"
"github:fgrehm/crib" = "latest"
"github:kunchenguid/no-mistakes" = "latest"
"github:Gaurav-Gosain/tuios" = "latest"
"github:vjeantet/alerter" = { version = "latest", os = ["macos"] }
"npm:chrome-devtools-axi" = "0.1.35"
"npm:gh-axi" = "0.1.35"
"npm:lavish-axi" = "0.1.79"
"npm:quota-axi" = "0.1.55"
"npm:tasks-axi" = "0.2.6"

[dotfile_groups.home]
root = "home"
exclude = [".config/mise"]

[dotfile_groups.home.entries]
"~/.config/ghostty/themes/active-theme" = { mode = "template" }
"~/.config/helix/languages.toml" = { mode = "template" }
"~/.config/helix/themes/active-theme.toml" = { mode = "template" }
"~/.config/television/themes/active-theme.toml" = { mode = "template" }
"~/.config/nvim/plugin/25_theme.lua" = { mode = "template" }
"~/.config/nvim-snacks/plugin/25_theme.lua" = { mode = "template", source = ".config/nvim/plugin/25_theme.lua.tera" }
"~/.config/tuios/config.toml" = { mode = "template", variants = [{ os = "macos", target = "~/Library/Application Support/tuios/config.toml" }, { default = true }] }
"~/.local/share/claude-lsp/.claude-plugin/marketplace.json" = { mode = "template" }
"~/.local/share/claude-lsp/plugins/elixir-lsp/.claude-plugin/plugin.json" = { mode = "template" }
"~/.local/share/claude-lsp/plugins/erlang-lsp/.claude-plugin/plugin.json" = { mode = "template" }
"~/.local/share/claude-lsp/plugins/scala-lsp/.claude-plugin/plugin.json" = { mode = "template" }
"~/.claude/settings.json/output-style" = { merge = true }
"~/.pi/agent/settings.json/extensions" = { merge = true }

[dotfiles]
"~/.local/state/firstmate/config/backend" = { content = "herdr\n" }

[bootstrap.repos]
"~/.local/share/zsh/plugins/fzf-tab" = { url = "https://github.com/Aloxaf/fzf-tab.git" }
"~/.local/share/zsh/plugins/zsh-autosuggestions" = { url = "https://github.com/zsh-users/zsh-autosuggestions.git" }
"~/.local/share/firstmate" = { url = "https://github.com/kunchenguid/firstmate" }

[bootstrap.services.mise-history]
builtin = "history-watch"

[tasks."dotfiles:update"]
description = "Pull the dotfiles repository and bootstrap this machine again"
dir = "{{ env.HOME }}/.dotfiles"
run = """
set -eu
if [ -d .jj ]; then
  jj git fetch
  jj rebase --branch @ --destination 'trunk()'
  if [ -n "$(jj log --no-graph -r '(trunk()..@) & conflicts()' -T 'change_id ++ "\\n"')" ]; then
    echo "jj rebase left conflicts in ~/.dotfiles; resolve them before bootstrapping" >&2
    exit 1
  fi
else
  git pull --ff-only
fi
mise bootstrap --update --yes
"""
