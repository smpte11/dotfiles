[settings]
dotfiles.root = "~/.dotfiles"

[vars]
profile = "personal"
email = "felix@brouss.eu"
theme = { default = "eldritch" }

[tools]
usage = "latest"
bat = "latest"
carapace = "latest"
delta = "latest"
eza = "latest"
fd = "latest"
fzf = "latest"
gh = "latest"
glow = "latest"
go = "latest"
gofumpt = "latest"
gum = "latest"
lazydocker = "latest"
lua-language-server = "latest"
jj = "latest"
jq = "latest"
jjui = "latest"
neovim = "latest"
node = "24.13.0"
oh-my-posh = "latest"
ripgrep = "latest"
television = "latest"
tree-sitter = "latest"
yq = "latest"
zoxide = "latest"
"aqua:zk-org/zk" = "latest"
"aqua:tealdeer-rs/tealdeer" = "latest"
"aqua:walles/moor" = { version = "latest", os = ["macos", "linux/x64"] }
"go:github.com/walles/moor/v2/cmd/moor" = { version = "latest", os = ["linux/arm64"] }
"github:vjeantet/alerter" = { version = "latest", os = ["macos"] }
"npm:chrome-devtools-axi" = "0.1.35"
"npm:gh-axi" = "0.1.35"
"npm:lavish-axi" = "0.1.79"
"npm:quota-axi" = "0.1.55"
"npm:tasks-axi" = "0.2.6"

[dotfile_groups.home]
root = "home"
exclude = [".config/mise"]

[dotfile_groups.home.entries]
"~/.config/ghostty/themes/active-theme" = { mode = "template" }
"~/.config/helix/languages.toml" = { mode = "template" }
"~/.config/helix/themes/active-theme.toml" = { mode = "template" }
"~/.config/television/themes/active-theme.toml" = { mode = "template" }
"~/.config/nvim/plugin/25_theme.lua" = { mode = "template" }
"~/.config/nvim-snacks/plugin/25_theme.lua" = { mode = "template", source = ".config/nvim/plugin/25_theme.lua.tera" }
"~/.local/share/claude-lsp/.claude-plugin/marketplace.json" = { mode = "template" }
"~/.local/share/claude-lsp/plugins/elixir-lsp/.claude-plugin/plugin.json" = { mode = "template" }
"~/.local/share/claude-lsp/plugins/erlang-lsp/.claude-plugin/plugin.json" = { mode = "template" }
"~/.local/share/claude-lsp/plugins/scala-lsp/.claude-plugin/plugin.json" = { mode = "template" }
"~/.claude/settings.json/output-style" = { merge = true }

[dotfiles]
"~/.dotfiles/home/.config/mise/conf.d/theme.toml" = { mode = "track" }
"~/.local/share/org.gnome.Ptyxis/palettes/Active Theme.palette" = { source = "~/.dotfiles/home/.local/share/org.gnome.Ptyxis/palettes/Active Theme.palette.tera", mode = "template" }

[history.reload]
"~/.dotfiles/home/.config/mise/conf.d/theme.toml" = "mise dot apply --yes"

[bootstrap.repos]
"~/.local/share/zsh/plugins/fzf-tab" = { url = "https://github.com/Aloxaf/fzf-tab.git" }
"~/.local/share/zsh/plugins/zsh-autosuggestions" = { url = "https://github.com/zsh-users/zsh-autosuggestions.git" }

[bootstrap.mise_shell_activate]
zprofile = "shims"

[bootstrap.services.mise-history]
builtin = "history-watch"

[bootstrap.hooks]
post-dotfiles = [
  'if command -v podman >/dev/null 2>&1; then for s in sonarr_api_key:SONARR_API_KEY radarr_api_key:RADARR_API_KEY radarr_kids_api_key:RADARR_KIDS_API_KEY prowlarr_api_key:PROWLARR_API_KEY questarr_api_key:QUESTARR_API_KEY qbit_username:QBIT_USERNAME qbit_password:QBIT_PASSWORD yts_api_url:YTS_API_URL; do n=${s%%:*}; v=${s##*:}; if [ -n "$(printenv "$v")" ]; then if podman secret exists "$n" >/dev/null 2>&1; then podman secret rm "$n" >/dev/null 2>&1; fi; printf %s "$(printenv "$v")" | podman secret create "$n" - >/dev/null; fi; done; fi; if command -v systemctl >/dev/null 2>&1; then systemctl --user daemon-reload; for t in configarr.timer questarr-config.timer qbit-vpn-guard.service; do if [ -f "$HOME/.config/systemd/user/$t" ]; then systemctl --user enable --now "$t"; fi; done; fi',
]

[tasks."dotfiles:update"]
description = "Pull the dotfiles repository and bootstrap this machine again"
dir = "{{ env.HOME }}/.dotfiles"
raw = true
run = """
set -eu
if [ -d .jj ]; then
  jj git fetch
  jj rebase --branch @ --destination 'trunk()'
  if [ -n "$(jj log --no-graph -r '(trunk()..@) & conflicts()' -T 'change_id ++ "\\n"')" ]; then
    echo "jj rebase left conflicts in ~/.dotfiles; resolve them before bootstrapping" >&2
    exit 1
  fi
else
  git pull --ff-only
fi
exec "$HOME/.local/bin/dotfiles-setup" update
"""
