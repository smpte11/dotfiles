[env]
_.file = { path = "{{ env.HOME }}/.vibe/.env", redact = true }

[tools]
"github:floatpane/matcha" = "latest"

[bootstrap.packages]
"flatpak-user:com.protonvpn.www" = { os = "linux" }

[bootstrap.hooks]
pre-packages = [
  "if command -v flatpak >/dev/null; then flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo; fi",
]

[dotfile_groups.base]
root = "base"

[dotfile_groups.base.entries]
"~/.vibe/config.toml" = { mode = "copy", source = ".vibe/config.toml", create_if_missing = true, permissions = "0600" }
"~/.vibe/.env" = { mode = "template", source = ".vibe/env.tera", create_if_missing = true, permissions = "0600" }

[bootstrap.directories."~/.vibe"]
mode = "0700"

[bootstrap.secrets.mistral_api_key]
env = "MISTRAL_API_KEY"
description = "Mistral API key for Vibe (pass://Personal/Vibe/API Key)"
allow_empty = true
