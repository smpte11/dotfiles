theme = "active-theme"

[editor]
line-number = "relative"
scroll-lines = 3
scrolloff = 8
true-color = true
mouse = true
bufferline = "multiple"

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.lsp]
display-messages = true
display-inlay-hints = true

[editor.statusline]
left = ["mode", "spinner", "file-name", "file-modification-indicator"]
center = ["version-control"]
right = ["diagnostics", "selections", "position", "file-encoding", "file-line-ending", "file-type"]
separator = "│"
mode.normal = "NORMAL"
mode.insert = "INSERT"
mode.select = "SELECT"

[editor.indent-guides]
render = true
character = "│"
debounce = 100

[editor.soft-wrap]
enable = true

[editor.file-picker]
hidden = false

[editor.search]
smart-case = true
wrap-around = true

[editor.whitespace]
render = "all"
characters = { space = "·", nbsp = "⍽", tab = "→", newline = "⏎" }

[keys.normal]
C-s = ":write"
C-q = ":quit"
C-x = ":quit!"

[keys.insert]
C-s = ":write"
C-q = ":quit"

[keys.normal.space]
x = ["extend_to_line_bounds", ":pipe md-todo-cycle"]

[keys.select.space]
x = ["extend_to_line_bounds", ":pipe md-todo-cycle"]
