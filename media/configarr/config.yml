prowlarr:
  main:
    base_url: http://localhost:9696
    api_key: !env PROWLARR_API_KEY
    tags:
      - netfelix
      - kids
    delete_unmanaged_tags:
      enabled: false
    applications:
      data:
        - name: Sonarr
          type: Sonarr
          sync_level: fullSync
          fields:
            prowlarrUrl: http://localhost:9696
            baseUrl: http://localhost:8989
            apiKey: !env SONARR_API_KEY
            syncCategories: [5000, 5010, 5020, 5030, 5040, 5045, 5050]
          tags:
            - netfelix
        - name: Radarr
          type: Radarr
          sync_level: fullSync
          fields:
            prowlarrUrl: http://localhost:9696
            baseUrl: http://localhost:7878
            apiKey: !env RADARR_API_KEY
            syncCategories: [2000, 2010, 2020, 2030, 2040, 2045, 2050, 2060]
          tags:
            - netfelix
        - name: Radarr Kids
          type: Radarr
          sync_level: fullSync
          fields:
            prowlarrUrl: http://localhost:9696
            baseUrl: http://localhost:7879
            apiKey: !env RADARR_KIDS_API_KEY
            syncCategories: [2000, 2010, 2020, 2030, 2040, 2045, 2050, 2060]
          tags:
            - kids
      delete_unmanaged:
        enabled: false
      sync_indexers: true
