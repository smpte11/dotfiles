sonarr:
  main:
    base_url: http://localhost:8989
    api_key: !env SONARR_API_KEY
    quality_definition:
      type: series
    include:
      - template: 72dae194fc92bf828f32cde7744e51a1
        source: TRASH
    root_folders:
      - /data/media/tv
    download_clients:
      data:
        - name: qBittorrent
          type: qbittorrent
          enable: true
          priority: 1
          remove_completed_downloads: true
          remove_failed_downloads: true
          fields:
            host: host.containers.internal
            port: 8081
            use_ssl: false
            username: !env QBIT_USERNAME
            password: !env QBIT_PASSWORD
            tv_category: sonarr
      update_password: true
      delete_unmanaged:
        enabled: false
      remote_paths:
        - host: host.containers.internal
          remote_path: /run/media/system/media/torrents
          local_path: /data/torrents
      delete_unmanaged_remote_paths: true

