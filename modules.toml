[module.work-mac]
description = "machine: work Mac with work, dev-work and desktop"
modules = ["work", "dev", "dev-work", "desktop"]

[module.home-desktop]
description = "machine: home desktop with base, dev-private, desktop and the Proton Pass agent"
modules = ["base", "dev", "dev-private", "desktop", "proton-pass", "ssh-agent"]

[module.media-server]
description = "machine: media server with base, media, gaming and the Proton Pass agent"
modules = ["base", "media", "gaming", "proton-pass", "ssh-agent"]

[module.tablet]
description = "machine: handheld tablet with base for Vibe"
modules = ["base"]

[module.base]
description = "personal identity with the signing key and Vibe"
modules = ["base"]

[module.dev]
description = "common dev tools: devcontainers, k9s skin, no-mistakes, firstmate and the tuios fork"
modules = ["dev"]

[module.dev-private]
description = "dev plus private tooling: pi, Codestral, ollama and crib"
modules = ["dev", "dev-private"]

[module.dev-work]
description = "dev plus work tooling: the Claude harness and keybindings"
modules = ["dev", "dev-work"]

[module.media]
description = "media player and server with the netfelix pod and a VPN-gated qbittorrent"
modules = ["media"]

[module.desktop]
description = "desktop extras with OpenDeck plugins and reminders"
modules = ["desktop"]

[module.gaming]
description = "questarr game manager with qbit and prowlarr secrets"
modules = ["gaming"]

[module.proton-pass]
description = "Proton Pass CLI (pass-cli) on any machine"
modules = ["proton-pass"]

[module.ssh-agent]
description = "Proton Pass SSH agent for git signing"
modules = ["ssh-agent"]

[module.work]
description = "work identity with the 1Password agent"
modules = ["work"]
