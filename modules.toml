[module.work-mac]
description = "machine: work Mac with work, dev-work and desktop"
modules = ["work", "dev", "dev-work", "desktop"]

[module.home-desktop]
description = "machine: home desktop with base, dev-private, desktop, gaming and the Proton Pass agent"
modules = ["base", "dev", "dev-private", "desktop", "torrent", "gaming", "proton-pass", "ssh-agent"]

[module.media-server]
description = "machine: media server with base, media and the Proton Pass agent"
modules = ["base", "torrent", "media", "proton-pass", "ssh-agent"]

[module.tablet]
description = "machine: handheld tablet with base for Vibe, pi, opencode and nvim-mini as the default editor"
modules = ["base", "tablet"]

[module.base]
description = "personal identity with the signing key, Vibe, pi, opencode and Proton VPN autostart"
modules = ["base"]

[module.dev]
description = "common dev tools: devcontainers, k9s skin, no-mistakes, firstmate and the tuios fork"
modules = ["dev"]

[module.dev-private]
description = "dev plus private tooling: Codestral, ollama and crib"
modules = ["dev", "dev-private"]

[module.dev-work]
description = "dev plus work tooling: the Claude harness and keybindings"
modules = ["dev", "dev-work"]

[module.torrent]
description = "netfelix pod with prowlarr, byparr and a VPN-gated qbittorrent"
modules = ["torrent"]

[module.media]
description = "torrent plus the media player and server: sonarr, radarr, jellyfin and seerr"
modules = ["torrent", "media"]

[module.desktop]
description = "desktop extras with OpenDeck plugins and reminders"
modules = ["desktop"]

[module.gaming]
description = "torrent plus the questarr game manager"
modules = ["torrent", "gaming"]

[module.proton-pass]
description = "Proton Pass CLI (pass-cli) on any machine"
modules = ["proton-pass"]

[module.ssh-agent]
description = "Proton Pass SSH agent for git signing"
modules = ["ssh-agent"]

[module.work]
description = "work identity with the 1Password agent"
modules = ["work"]
