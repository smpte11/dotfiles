prowlarr:
  main:
    base_url: http://localhost:9696
    api_key: !env PROWLARR_API_KEY
    tags:
      - netfelix
      - kids
    delete_unmanaged_tags:
      enabled: false
    sync_profiles:
      data:
        - name: netfelix
          enable_rss: true
          enable_automatic_search: true
          enable_interactive_search: true
          minimum_seeders: 1
      delete_unmanaged:
        enabled: false
    indexer_proxies:
      data:
        - name: byparr
          type: FlareSolverr
          fields:
            host: http://localhost:8191/
          tags:
            - netfelix
      delete_unmanaged:
        enabled: true
    indexers:
      data:
        - name: Knaben
          definition: Knaben
          enable: true
          priority: 25
          sync_profile: netfelix
          tags:
            - netfelix
            - kids
        - name: LimeTorrents
          definition: limetorrents
          enable: true
          priority: 25
          sync_profile: netfelix
          tags:
            - netfelix
            - kids
        - name: Torrent9
          definition: torrent9
          enable: true
          priority: 25
          sync_profile: netfelix
          tags:
            - netfelix
            - kids
        - name: TorrentDownload
          definition: torrentdownload
          enable: true
          priority: 25
          sync_profile: netfelix
          tags:
            - netfelix
            - kids
        - name: YTS
          definition: yts
          enable: true
          priority: 25
          sync_profile: netfelix
          tags:
            - netfelix
            - kids
          fields:
            apiurl: !env YTS_API_URL
      delete_unmanaged:
        enabled: false
