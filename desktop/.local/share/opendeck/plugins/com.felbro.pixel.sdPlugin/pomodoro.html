<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        color-scheme: dark;
        --surface: #2d2d2d;
        --field: #3d3d3d;
        --text: #d8d8d8;
        --label: #9a9a9a;
      }
      body {
        margin: 0;
        padding: 8px 0;
        background: var(--surface);
        color: var(--label);
        font: 9pt system-ui, -apple-system, sans-serif;
      }
      label {
        display: grid;
        grid-template-columns: 120px minmax(0, 1fr);
        align-items: center;
        gap: 8px;
        min-height: 30px;
      }
      input[type="number"] {
        box-sizing: border-box;
        width: 100%;
        height: 26px;
        padding: 0 8px;
        border: 1px solid #303030;
        background: var(--field);
        color: var(--text);
        font: 600 10pt system-ui, -apple-system, sans-serif;
      }
      input[type="checkbox"] {
        justify-self: start;
        width: 16px;
        height: 16px;
        margin: 0;
      }
    </style>
    <script>
      const fields = [
        { id: "workMinutes", fallback: 25 },
        { id: "shortBreakMinutes", fallback: 5 },
        { id: "longBreakMinutes", fallback: 15 },
        { id: "totalCycles", fallback: 4 },
      ];

      function connectElgatoStreamDeckSocket(port, uuid, registerEvent, info, actionInfo) {
        const { context, payload } = JSON.parse(actionInfo);
        const websocket = new WebSocket(`ws://127.0.0.1:${port}`);
        websocket.onopen = () => websocket.send(JSON.stringify({ event: registerEvent, uuid }));

        const autoAdvance = document.getElementById("autoAdvance");
        const show = (settings) => {
          for (const { id, fallback } of fields) document.getElementById(id).value = settings[id] ?? fallback;
          autoAdvance.checked = settings.autoAdvance ?? false;
        };
        show(payload.settings);

        const update = () => {
          const settings = { autoAdvance: autoAdvance.checked };
          for (const { id } of fields) {
            const input = document.getElementById(id);
            if (!input.checkValidity() || input.value === "") return;
            settings[id] = Number(input.value);
          }
          websocket.send(JSON.stringify({ event: "setSettings", context, payload: settings }));
        };
        for (const input of document.querySelectorAll("input")) input.addEventListener("change", update);

        websocket.onmessage = ({ data }) => {
          const message = JSON.parse(data);
          if (message.event === "didReceiveSettings") show(message.payload.settings);
        };
      }
    </script>
  </head>
  <body>
    <label>Work minutes <input id="workMinutes" type="number" min="1" max="180" step="1" required /></label>
    <label>Break minutes <input id="shortBreakMinutes" type="number" min="1" max="60" step="1" required /></label>
    <label>Long break minutes <input id="longBreakMinutes" type="number" min="1" max="120" step="1" required /></label>
    <label>Cycles <input id="totalCycles" type="number" min="1" max="6" step="1" required /></label>
    <label>Continue on its own <input id="autoAdvance" type="checkbox" /></label>
  </body>
</html>
